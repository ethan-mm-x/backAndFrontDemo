# 开放 API 单机测试：无 MySQL / Redis 容器，内嵌 H2 + 内存 Nonce
spring:
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true

aksk:
  clients:
    - access-key: ${AKSK_ACCESS_KEY:demo-ak-001}
      secret-key: ${AKSK_SECRET_KEY:demo-sk-please-change-me}
      name: ${AKSK_CLIENT_NAME:demo-client}
