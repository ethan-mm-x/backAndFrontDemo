# 测试用：只跑开放 API，单容器，无 MySQL/Redis 镜像
# 本机: ./scripts/pack-images.sh → 只打 demo-backend
# 服务器: docker load + docker compose up -d

services:
  backend:
    image: demo-backend:0.0.1
    container_name: demo-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: openapi
      AKSK_ACCESS_KEY: ${AKSK_ACCESS_KEY:-demo-ak-001}
      AKSK_SECRET_KEY: ${AKSK_SECRET_KEY:-a8f3K9mQx2Vp7nR4wYcE6uHt1bZs0Ld9}
      AKSK_CLIENT_NAME: ${AKSK_CLIENT_NAME:-demo-client}
